name: Push and Deploy Images

on:
  push:
    branches: ["develop"]

env:
  REGISTRY: registry.dms-lookup.com
  REGISTRY_USER: prod
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
  COMPOSE_FILE: docker-compose-build-all.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # For some reason won't next job work if this does not run.
      - name: Curl registry (warm-up)
        run: curl -v https://registry.dms-lookup.com/v2/

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build all images
        working-directory: src
        run: docker compose -f ${{ env.COMPOSE_FILE }} build

      - name: Tag all images with :${{ github.sha }} and :latest
        working-directory: src
        run: |
          set -euo pipefail

          IMAGES="$(docker compose -f ${{ env.COMPOSE_FILE }} config --images)"
          echo "Images from compose:"
          echo "$IMAGES"

          # Give every image a tag
          # <image>:latest
          # <image>:sha_sum
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            base="$img"
            if echo "$img" | grep -qE ':[^/]+$'; then
              base="${img%:*}"
            fi
            echo "Tagging $img -> $base:latest and $base:${GITHUB_SHA}"
            docker tag "$img" "$base:latest"
            docker tag "$img" "$base:${GITHUB_SHA}"
          done <<< "$IMAGES"

      - name: Push all images (latest + sha)
        working-directory: src
        run: |
          set -euo pipefail

          IMAGES="$(docker compose -f ${{ env.COMPOSE_FILE }} config --images)"
          while IFS= read -r img; do
            [ -z "$img" ] && continue

            base="$img"
            if echo "$img" | grep -qE ':[^/]+$'; then
                base="${img%:*}"
            fi

            echo "Pushing $base:latest"
            docker push "$base:latest"
            echo "Pushing $base:${GITHUB_SHA}"
            docker push "$base:${GITHUB_SHA}"
          done <<< "$IMAGES"

      - name: Trigger deploy webhook (HMAC SHA-256)
        run: |
          set -euo pipefail

          BODY='{"tag":"'"${GITHUB_SHA}"'"}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"

          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY"
